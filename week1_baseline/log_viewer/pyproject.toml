[project]
name = "boukensha-logviewer"
version = "0.1.0"
description = "Reads a boukensha session log and makes it answerable"
requires-python = ">=3.12"
# No dependencies, by design. The page is hand-built HTML with inline CSS and
# inline SVG, served by the standard library, so there is no framework, no
# template engine and no CDN asset between a log and its reader.
dependencies = []

[project.scripts]
boukensha-logviewer = "logviewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logviewer"]
