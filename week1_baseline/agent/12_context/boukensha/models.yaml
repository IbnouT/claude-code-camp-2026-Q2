# Model catalog: context windows and USD costs per million tokens.
# Every value is taken from that model's own provider page, verified 2026-07:
#   Anthropic  platform.claude.com/docs/en/about-claude/pricing,
#              /build-with-claude/effort, /build-with-claude/thinking-troubleshooting
#   OpenAI     developers.openai.com/api/docs/models/<model>
#   Gemini     ai.google.dev/gemini-api/docs/pricing, /docs/models
#   Ollama     ollama.com/library/<model>, docs.ollama.com/cloud
# thinking_default is the model's documented default thinking state
# (off | on | always_on) and governs what `none` does.
# Override or extend any entry with models.yaml in your .boukensha directory.

anthropic:
  claude-fable-5:
    context_window: 1_000_000
    cost_per_million: {input: 10.00, output: 50.00}
    usage_unit: tokens
    thinking: adaptive
    thinking_default: always_on
    thinking_levels: [low, medium, high, xhigh, max]
  claude-opus-4-8:
    context_window: 1_000_000
    cost_per_million: {input: 5.00, output: 25.00}
    usage_unit: tokens
    thinking: adaptive
    thinking_default: off
    thinking_levels: [low, medium, high, xhigh, max]
  claude-opus-4-7:
    context_window: 1_000_000
    cost_per_million: {input: 5.00, output: 25.00}
    usage_unit: tokens
    thinking: adaptive
    thinking_default: off
    thinking_levels: [low, medium, high, xhigh, max]
  claude-sonnet-5:
    context_window: 1_000_000
    # Introductory pricing through 2026-08-31; standard is 3.00/15.00 after.
    cost_per_million: {input: 2.00, output: 10.00}
    usage_unit: tokens
    thinking: adaptive
    thinking_default: on
    thinking_levels: [low, medium, high, xhigh, max]
  claude-sonnet-4-6:
    context_window: 1_000_000
    cost_per_million: {input: 3.00, output: 15.00}
    usage_unit: tokens
    thinking: adaptive
    thinking_default: off
    thinking_levels: [low, medium, high, max]
  claude-haiku-4-5:
    context_window: 200_000
    cost_per_million: {input: 1.00, output: 5.00}
    usage_unit: tokens
    thinking: budget
    thinking_default: off
    thinking_levels: [low, medium, high]
  claude-haiku-4-5-20251001:
    context_window: 200_000
    cost_per_million: {input: 1.00, output: 5.00}
    usage_unit: tokens
    thinking: budget
    thinking_default: off
    thinking_levels: [low, medium, high]
  claude-opus-4-5:
    context_window: 200_000
    cost_per_million: {input: 5.00, output: 25.00}
    usage_unit: tokens
    thinking: budget
    thinking_default: off
    thinking_levels: [low, medium, high]

