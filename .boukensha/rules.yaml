# Standing advice the agent carries. Genre common sense only: nothing here
# names a place, a creature, or anything that has to be discovered by
# playing. Every number lives in settings.
#
# Each rule names the action it is about, because advice you cannot act on
# leaves you where you were.
rules:
  - id: appraise-before-fighting
    text: >-
      Size up anything before you choose to fight it (consider), and walk
      away from what is beyond you rather than testing it.
    enabled: true
  - id: outmatched-means-prepare
    text: >-
      Being outmatched is not solved by trying again. Grow stronger or
      come back better equipped.
    enabled: true
  - id: fighting-takes-rounds
    text: >-
      A fight is not one command. Start it (attack), then keep watching
      (poll) until something ends it, and flee (flee) if it turns.
    enabled: true
  - id: carry-little-gold
    text: >-
      Money you carry is lost when you die. Bank what you are not about
      to spend (bank_surplus), keeping about {gold_carry_ceiling} on you.
    enabled: true
  - id: rest-before-going-on
    text: >-
      Rest when movement runs low, and eat or drink when hungry or
      thirsty (consume_item). Nothing recovers while you are starving.
    enabled: true
  - id: take-what-is-free
    text: >-
      Collect free equipment before hunting, and put it on (get_item,
      equip_item). Wearing something beats carrying nothing.
    enabled: true
  - id: loot-after-a-kill
    text: >-
      Search what you kill (get_item). Coins, keys and gear are left
      behind, and the game collects them for you when it can.
    enabled: true
  - id: move-on-when-it-stops-paying
    text: >-
      When each kill rewards less than the last, the prey has been
      outgrown. Find harder ground.
    enabled: true
  - id: know-before-deciding
    text: >-
      Ask what you already know before deciding (recall). You have walked
      further than you remember.
    enabled: true
