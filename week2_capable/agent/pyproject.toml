[project]
name = "boukensha"
version = "0.12.1"
description = "A baseline MUD-playing agent, built step by step"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "textual>=0.86",
]

[project.scripts]
boukensha = "boukensha.launcher:main"
boukensha-sessions = "boukensha.runtime_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boukensha"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
