[project]
name = "observatory-v3-backend"
version = "0.1.0"
description = "Bounded typed backend for the Boukensha Observatory"
requires-python = ">=3.12"
dependencies = [
    "boukensha-gateway",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "starlette==1.3.1",
    "uvicorn==0.52.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
observatory-v3-openapi = "observatory_v3_backend.api_v1.openapi:main"

[dependency-groups]
dev = [
    "anyio==4.14.2",
    "httpx==0.28.1",
    "mypy==2.3.0",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
    "types-pyyaml==6.0.12.20260724",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["^tests/parity/"]

[tool.uv.sources]
boukensha-gateway = { path = "../../gateway", editable = true }
