[project]
name = "boukensha-benchmark"
version = "0.1.0"
description = "Cost and correctness benchmarks for Boukensha game journeys"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0,<7",  # reads the public agent settings into an isolated overlay
  "python-dotenv>=1.0,<2",  # resolves profile secrets without copying them into attempts
]

[project.scripts]
boukensha-e1 = "benchmark.e1:main"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
