[project]
name = "boukensha-gateway"
version = "0.1.0"
description = "The only component that touches the game."
requires-python = ">=3.12"
dependencies = [
  # Bundle A, as ruled. One line each.
  "pydantic>=2.9,<3",        # runtime schema validation at process and MCP boundaries
  "mcp>=1.2,<2",             # the open MCP protocol, low-level Server API only
  "starlette>=0.41,<1",      # small ASGI surface for SSE, replay queries and control
  "uvicorn>=0.32,<1",        # runs the local ASGI app
  "PyYAML>=6.0,<7",          # parses the shared human-readable settings file
  "python-dotenv>=1.0,<2",   # loads secrets from the shared .env file
]

[project.scripts]
boukensha-gateway = "mud_gateway.mcp_server:main"
boukensha-gateway-admin = "admin_process.server:main"
boukensha-gateway-api = "mud_gateway.api:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",          # exercises the ASGI live and replay contract in process
  "pytest>=8.0",
  "pytest-asyncio>=0.24",    # the transport, framing and reconnect paths are async
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mud_gateway", "admin_process"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
