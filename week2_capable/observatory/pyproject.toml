[project]
name = "boukensha-observatory"
version = "0.1.0"
description = "A causal flight recorder and experiment studio for Boukensha."
requires-python = ">=3.12"
dependencies = [
  "boukensha-gateway",  # reuses the canonical parser for offline counterfactual replay
  "httpx==0.28.1",     # async, typed access to gateway evidence sources
  "pydantic==2.13.4",  # validates source capability and API boundaries
  "python-dotenv==1.2.2", # safely loads untracked shared secrets without shell parsing
  "PyYAML==6.0.3",     # reads non-secret Observatory policy from shared settings
  "starlette==0.52.1", # focused local read API and static application host
  "uvicorn==0.51.0",   # serves the installed local observatory
]

[tool.uv.sources]
boukensha-gateway = { path = "../gateway" }

[project.scripts]
boukensha-observatory = "observatory_api.app:main"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observatory_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
